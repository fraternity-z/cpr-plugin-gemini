[package]
name = "cpr-plugin-gemini"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Gemini API upstream adapter for Codex Proxy RS"
publish = false

[dependencies]
base64 = "=0.22.1"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "5358de53ddd4bda529cb63c422fd5c6af070f9c9", version = "0.1.0", features = ["io"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
